openapi: 3.0.3
info:
  title: Agile Tool API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /projects:
    get:
      summary: List projects the authenticated user belongs to
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: status
          schema:
            type: string
            enum: [active, archived]
            default: active
      responses:
        '200':
          description: Paginated projects including the caller's role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectWithRole'
    post:
      summary: Create a project and add the caller as owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        '422':
          $ref: '#/components/responses/Error'
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Get a project and the caller's membership role
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: '#/components/schemas/ProjectWithRole'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update project name or description (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      summary: Archive a project (owner only)
      responses:
        '204':
          description: Project archived; no response body
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /projects/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      summary: Restore an archived project (owner only)
      responses:
        '200':
          description: Restored project
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /projects/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project members
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMembers'
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: Add a member or viewer (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Added member
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /projects/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      summary: Change a member's role (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [member, viewer]
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a member (owner only)
      responses:
        '204':
          description: Member removed; no response body
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /projects/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List recent project activity
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated activity, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivity'
        '404':
          $ref: '#/components/responses/Error'
  /users:
    get:
      summary: Search users by name or email
      parameters:
        - in: query
          name: search
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Up to 20 matching safe user projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '422':
          $ref: '#/components/responses/Error'
  /projects/{id}/stories:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project stories
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: status
          schema:
            type: string
            enum: [backlog, in_progress, in_review, done]
        - in: query
          name: priority
          schema:
            type: string
            enum: [low, medium, high]
        - in: query
          name: assignee_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: sort
          schema:
            type: string
            enum: [position, -position, priority, -priority, created_at, -created_at, story_points, -story_points]
            default: position
      responses:
        '200':
          description: Paginated stories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStories'
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: Create a story (owner or member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryInput'
      responses:
        '201':
          description: Created story
          content:
            application/json:
              schema:
                type: object
                properties:
                  story:
                    $ref: '#/components/schemas/Story'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /projects/{id}/tree:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Get project details including the caller's role, stories, progress, and nested tasks
      responses:
        '200':
          description: Project tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTree'
        '404':
          $ref: '#/components/responses/Error'
  /stories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Get a story
      responses:
        '200':
          description: Story
          content:
            application/json:
              schema:
                type: object
                properties:
                  story:
                    $ref: '#/components/schemas/Story'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update a story (owner or member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryPatch'
      responses:
        '200':
          description: Updated story
          content:
            application/json:
              schema:
                type: object
                properties:
                  story:
                    $ref: '#/components/schemas/Story'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a story and cascade its tasks (owner only)
      responses:
        '204':
          description: Story and tasks deleted
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /stories/{id}/tasks:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: List tasks for a story
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: status
          schema:
            type: string
            enum: [todo, in_progress, done]
        - in: query
          name: assignee_id
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTasks'
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: Create a task (owner or member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Get a task
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update a task (owner or member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a task (owner or member)
      responses:
        '204':
          description: Task deleted
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /me/tasks:
    get:
      summary: List my assigned tasks in active member projects
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: status
          schema:
            type: string
            enum: [todo, in_progress, done]
        - in: query
          name: overdue
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paginated assigned tasks with story and project names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTasks'
  /notifications:
    get:
      summary: List the authenticated user's notifications
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: unread
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paginated notifications belonging to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
        '401':
          $ref: '#/components/responses/Error'
  /notifications/read-all:
    post:
      summary: Mark all of the authenticated user's notifications as read
      responses:
        '200':
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
        '401':
          $ref: '#/components/responses/Error'
  /notifications/{id}/read:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      summary: Mark one of the authenticated user's notifications as read
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                required: [notification]
                properties:
                  notification:
                    $ref: '#/components/schemas/Notification'
        '404':
          $ref: '#/components/responses/Error'
  /admin/jobs:
    get:
      summary: List jobs (administrator only)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, running, succeeded, dead]
            default: dead
      responses:
        '200':
          description: Paginated jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobs'
        '403':
          $ref: '#/components/responses/Error'
  /admin/jobs/{id}/retry:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      summary: Retry a dead job (administrator only)
      responses:
        '200':
          description: Reset job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Error:
      description: Standard API error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
    Pagination:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Notification:
      type: object
      required: [id, user_id, type, payload, idempotency_key, read_at, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          enum: [task_completed, story_completed]
        payload:
          type: object
        idempotency_key:
          type: string
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Job:
      type: object
      required: [id, type, payload, status, attempts, max_attempts, run_at, created_at]
      properties:
        id:
          type: integer
        type:
          type: string
        payload:
          type: object
        status:
          type: string
          enum: [pending, running, succeeded, dead]
        attempts:
          type: integer
        max_attempts:
          type: integer
        run_at:
          type: string
          format: date-time
        last_error:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    PaginatedNotifications:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
    PaginatedJobs:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Job'
    Project:
      type: object
      required: [id, name, description, owner_id, archived_at, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 5000
        owner_id:
          type: integer
        role:
          type: string
          enum: [owner, member, viewer]
        archived_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectWithRole:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required: [role]
          properties:
            role:
              type: string
              enum: [owner, member, viewer]
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 5000
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 5000
    Member:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, member, viewer]
    MemberInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [member, viewer]
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
    Activity:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        actor_id:
          type: integer
          nullable: true
        actor_name:
          type: string
          nullable: true
        entity_type:
          type: string
        entity_id:
          type: integer
        action:
          type: string
        meta:
          type: object
        created_at:
          type: string
          format: date-time
    PaginatedMembers:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    PaginatedUsers:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'
    PaginatedActivity:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Activity'
    Story:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 5000
        acceptance_criteria:
          type: string
          nullable: true
          maxLength: 5000
        status:
          type: string
          enum: [backlog, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high]
        story_points:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        assignee_id:
          type: integer
          nullable: true
        assignee:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        position:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StoryFields:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 5000
        acceptance_criteria:
          type: string
          nullable: true
          maxLength: 5000
        status:
          type: string
          enum: [backlog, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high]
        story_points:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        assignee_id:
          type: integer
          nullable: true
    StoryInput:
      allOf:
        - $ref: '#/components/schemas/StoryFields'
        - type: object
          required: [title]
    StoryPatch:
      allOf:
        - $ref: '#/components/schemas/StoryFields'
        - type: object
          minProperties: 1
          properties:
            position:
              type: number
              minimum: 0
    Task:
      type: object
      properties:
        id:
          type: integer
        story_id:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 5000
        status:
          type: string
          enum: [todo, in_progress, done]
        assignee_id:
          type: integer
          nullable: true
        assignee:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        estimate_hours:
          type: number
          minimum: 0
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        position:
          type: number
        story_title:
          type: string
        project_id:
          type: integer
        project_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskFields:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 5000
        status:
          type: string
          enum: [todo, in_progress, done]
        assignee_id:
          type: integer
          nullable: true
        estimate_hours:
          type: number
          minimum: 0
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
    TaskInput:
      allOf:
        - $ref: '#/components/schemas/TaskFields'
        - type: object
          required: [title]
    TaskPatch:
      allOf:
        - $ref: '#/components/schemas/TaskFields'
        - type: object
          minProperties: 1
          properties:
            position:
              type: number
              minimum: 0
    StoryTree:
      allOf:
        - $ref: '#/components/schemas/Story'
        - type: object
          required: [progress, tasks]
          properties:
            progress:
              type: object
              required: [done_tasks, total_tasks, percent]
              properties:
                done_tasks:
                  type: integer
                total_tasks:
                  type: integer
                percent:
                  type: integer
                  minimum: 0
                  maximum: 100
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/Task'
    ProjectTree:
      type: object
      required: [project, stories]
      properties:
        project:
          $ref: '#/components/schemas/ProjectWithRole'
        stories:
          type: array
          items:
            $ref: '#/components/schemas/StoryTree'
    PaginatedStories:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Story'
    PaginatedTasks:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Task'